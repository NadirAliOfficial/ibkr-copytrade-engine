name: Build Pax Americana EXE

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller ib_insync requests pillow tzdata

      - name: Build transparent app icon (.ico)
        shell: python
        run: |
          from PIL import Image
          import os

          src = os.path.join("assets", "pax_americana.png")
          img = Image.open(src).convert("RGBA")

          # Remove near-black background (keep dark blues).
          threshold = 18
          px = []
          for (r, g, b, a) in img.getdata():
              if r < threshold and g < threshold and b < threshold:
                  px.append((r, g, b, 0))
              else:
                  px.append((r, g, b, a))
          img.putdata(px)

          # Pad to a square canvas so Windows uses it cleanly everywhere.
          w, h = img.size
          side = max(w, h)
          pad = int(side * 0.10)
          side2 = side + pad * 2
          canvas = Image.new("RGBA", (side2, side2), (0, 0, 0, 0))
          x = (side2 - w) // 2
          y = (side2 - h) // 2
          canvas.paste(img, (x, y), img)

          canvas.save(
              "pax_americana.ico",
              sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]
          )
          print("Icon built: pax_americana.ico")

      - name: Build EXE
        run: pyinstaller build_neroai.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pax_Americana_EXE
          path: dist/Pax_Americana.exe